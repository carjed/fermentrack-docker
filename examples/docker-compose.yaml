# Live deployment. Run from this directory:  docker compose build && docker compose up -d
version: '3'

services:
  fermentrack:
    # Built locally from ../fermentrack (a local name, so "docker compose pull" can't replace it with the Docker Hub image)
    image: fermentrack-local
    build:
      context: ../fermentrack
      args:
        FERMENTRACK_GITHUB: carjed/fermentrack
        # Branch of the fermentrack repo to build. Switch back to "custom" once home-assistant-api is merged into it.
        FERMENTRACK_REF: home-assistant-api
    container_name: fermentrack
    restart: always
    #network_mode: "host"
    privileged: true
    expose:
        - "81"
    ports:
        - "81:8080"
    volumes:
        - ./volumes/db:/home/fermentrack/fermentrack/db
        - ./volumes/data:/home/fermentrack/fermentrack/data
        - ./volumes/log:/home/fermentrack/fermentrack/log
        # Backups made in the web UI (Site settings > Backups). Without this they are lost on every rebuild.
        - ./volumes/backups:/home/fermentrack/fermentrack/backup_files
        - /dev:/dev
